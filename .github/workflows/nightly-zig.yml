name: nightly-zig

# The bleeding-edge lane: does the master Zig still compile the kernels, and does
# the Rust↔Zig seam still hold? Runs nightly and on demand.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v1
        with:
          version: master

      - name: zig version (master)
        run: zig version

      - name: kernels on Zig master (differential vs scalar)
        run: zig test wupz-zig/src/kernels.zig

      - name: the seam on Zig master (Rust core links the master-built kernels)
        run: cargo test --quiet
